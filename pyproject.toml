[project]
name = "no-fly-zone"
version = "0.1.0"
description = "A fruit-fly connectome pilots a retro-futuristic cockpit playing Atari Battlezone"
requires-python = ">=3.11"
dependencies = [
    "ale-py>=0.12",
    "gymnasium>=1.0",
    "mujoco>=3.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "pillow>=10.0",
    "imageio[ffmpeg]>=2.34",
    "pandas>=2.1",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest"]
cuda = ["torch>=2.5"]  # brain_cuda: Triton kernels + CUDA graphs (Linux/NVIDIA)

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
