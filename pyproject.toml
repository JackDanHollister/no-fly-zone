[project]
name = "no-fly-zone"
version = "0.1.0"
description = "A real fruit-fly connectome, spiking over the measured wiring, pilots an Atari Battlezone tank from inside a retro-futuristic cockpit"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jack Daniel Hollister" }]
requires-python = ">=3.11"
keywords = ["connectome", "flywire", "drosophila", "spiking-neural-network", "mujoco", "atari", "battlezone"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "ale-py>=0.12",
    "gymnasium>=1.0",
    "mujoco>=3.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "pillow>=10.0",
    "imageio[ffmpeg]>=2.34",
    "pandas>=2.1",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest"]
cuda = ["torch>=2.5"]  # brain_cuda: Triton kernels + CUDA graphs (Linux/NVIDIA)

[project.urls]
Repository = "https://github.com/JackDanHollister/no-fly-zone"
Changelog = "https://github.com/JackDanHollister/no-fly-zone/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
